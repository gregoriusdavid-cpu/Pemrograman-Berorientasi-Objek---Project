# =============================================
# Portal Layanan - Kelompok 15
# Database: MySQL via XAMPP + HeidiSQL
# =============================================

spring.application.name=portal-layanan

# --- Database Connection ---
# Pastikan XAMPP MySQL sudah berjalan di port 3306
# Buat database "portal_layanan" di HeidiSQL terlebih dahulu:
#   CREATE DATABASE portal_layanan CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
spring.datasource.url=jdbc:mysql://localhost:3306/portal_layanan?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning (HikariCP default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
# create-drop  : buat ulang tabel setiap restart (pakai saat development awal)
# update       : update struktur tanpa hapus data (pakai setelah data ada)
# validate     : hanya validasi, tidak ubah apapun (production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Prevent LazyInitializationException on serialization
spring.jpa.open-in-view=false

# --- Server ---
server.port=8080

# --- Jackson (JSON) ---
# Agar LocalDate / LocalDateTime ter-serialize dengan benar
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Jakarta

# --- Logging ---
logging.level.com.kelompok15=DEBUG
logging.level.org.hibernate.SQL=DEBUG
